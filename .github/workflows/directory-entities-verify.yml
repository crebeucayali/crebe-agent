name: Directorio de entidades - Verificador solo lectura

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'directory_entities_verify.mjs'
      - 'tests/directory_entities_verify.test.mjs'
      - '.github/workflows/directory-entities-verify.yml'
      - 'docs/DIRECTORIO_ENTIDADES_ETAPA_3_VERIFICADOR.md'
      - 'tracking/directorio-entidades-etapa-3.json'

permissions:
  contents: read

concurrency:
  group: crebe-directory-entities-verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verificar directorio sin modificar datos
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Obtener agente
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Obtener Accesos Complementarios en modo lectura
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: crebeucayali/accesos-complementarios
          ref: main
          path: target
          persist-credentials: false

      - name: Preparar Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '20'

      - name: Ejecutar pruebas del verificador
        run: node --test tests/directory_entities_verify.test.mjs

      - name: Ejecutar verificación real
        run: node directory_entities_verify.mjs --source target/directorios/directorio-ciudadano.js --output reports/directorio-entidades --concurrency 6

      - name: Mostrar resumen
        if: always()
        shell: bash
        run: |
          if [ -f reports/directorio-entidades/Informe_directorio_entidades.md ]; then
            cat reports/directorio-entidades/Informe_directorio_entidades.md >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Guardar evidencia
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: directorio-entidades-verificacion-${{ github.run_id }}
          path: reports/directorio-entidades/
          if-no-files-found: error
          retention-days: 30
