name: Seguridad EVA - Monitoreo recurrente

on:
  workflow_dispatch:
  schedule:
    - cron: '15 11 * * *'
  pull_request:
    branches: [main]
    paths:
      - 'security_monitor.py'
      - 'state/current.json'
      - 'config/security-monitor.json'
      - 'tests/test_security_monitor.py'
      - 'security_correction_validate.py'
      - 'tests/test_security_correction.py'
      - 'reports/fase-7-etapa-7-correccion-seguridad.json'
      - '.github/workflows/security-monitor.yml'

permissions:
  contents: read

concurrency:
  group: crebe-security-monitor
  cancel-in-progress: false

jobs:
  monitor:
    name: Ejecutar monitoreo de seguridad
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Obtener agente
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Preparar Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Validar cierre de la Etapa 7
        run: |
          python -m unittest tests.test_security_correction -v
          python security_correction_validate.py

      - name: Ejecutar pruebas del monitor
        run: python -m unittest tests.test_security_monitor -v

      - name: Ejecutar monitoreo
        id: monitor
        continue-on-error: true
        run: python security_monitor.py reports/security-monitor

      - name: Mostrar informe
        if: always()
        shell: bash
        run: |
          if [ -f reports/security-monitor/Informe_monitoreo_seguridad.md ]; then
            cat reports/security-monitor/Informe_monitoreo_seguridad.md >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Guardar evidencia
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: crebe-monitoreo-seguridad-${{ github.run_id }}
          path: reports/security-monitor/
          if-no-files-found: warn
          retention-days: 30

      - name: Marcar alerta
        if: steps.monitor.outcome == 'failure'
        run: |
          echo 'Se detectó una regresión de seguridad. Revise el resumen y el artefacto.'
          exit 1
