name: Integridad Supabase - Fase 6 Etapa 6

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'reports/fase-6-etapa-6-diagnostico.json'
      - 'supabase_integrity_diagnosis_validate.py'
      - 'tests/test_supabase_integrity_diagnosis.py'
      - 'docs/FASE_6_ETAPA_6_DIAGNOSTICO_INTEGRIDAD.md'
      - 'tracking/fase-6-etapa-6.json'
      - 'tracking/fase-6.json'
      - 'tracking/phases.json'
      - '.github/workflows/supabase-integrity-diagnosis.yml'
  push:
    branches: [main]
    paths:
      - 'reports/fase-6-etapa-6-diagnostico.json'
      - 'supabase_integrity_diagnosis_validate.py'
      - 'tests/test_supabase_integrity_diagnosis.py'
      - '.github/workflows/supabase-integrity-diagnosis.yml'

permissions:
  contents: read

jobs:
  validate-diagnosis:
    runs-on: ubuntu-latest
    steps:
      - name: Obtener agente
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Ejecutar pruebas de Etapa 6
        run: python -m unittest tests/test_supabase_integrity_diagnosis.py
      - name: Validar diagnostico comprometido
        run: python supabase_integrity_diagnosis_validate.py
