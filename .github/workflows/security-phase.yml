name: Seguridad EVA - Fase 7 Preparacion

on:
  pull_request:
    paths:
      - 'config/fase-7-security-scope.json'
      - 'tracking/fase-7.json'
      - 'docs/FASE_7_SEGURIDAD_PERMISOS.md'
      - 'security_phase_validate.py'
      - 'tests/test_security_phase.py'
      - '.github/workflows/security-phase.yml'
      - 'tracking/phases.json'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-security-phase:
    runs-on: ubuntu-latest
    steps:
      - name: Obtener agente
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Preparar Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Ejecutar pruebas
        run: python -m unittest -q tests/test_security_phase.py
      - name: Validar preparacion
        run: python security_phase_validate.py
