name: Fase 9 Etapa 6 - Cierre temporal

on:
  push:
    branches: [fase-9-etapa-6-enlazado-interno]
    paths:
      - '.github/workflows/fase-9-etapa-6-finalize-temp.yml'

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Obtener rama controlada
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: fase-9-etapa-6-enlazado-interno

      - name: Cerrar Etapa 6 sin iniciar Etapa 7
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import json

          RUN=38338278100
          ART=11785671168
          FINAL={
            'official_edges':416,
            'missing_route_files':0,
            'orphan_pages':0,
            'unreachable_from_root':0,
            'pages_without_official_outgoing':0,
            'invalid_hrefs':0,
            'non_https_internal_links':0,
          }

          for file in ('reports/fase-9-etapa-6-enlazado-interno.json','tracking/fase-9-etapa-6.json'):
            p=Path(file)
            d=json.loads(p.read_text(encoding='utf-8'))
            d['estado']='ETAPA_6_COMPLETADA_ENLAZADO_INTERNO'
            d['workflow_run_id']=RUN
            d['artifact_id']=ART
            d['validacion_ci']='SUCCESS'
            if file.startswith('reports/'):
              d['resultado_final']=FINAL.copy()
            else:
              for k,v in FINAL.items(): d[f'{k}_final']=v
            d['guardrails']['etapa_7_iniciada']=False
            p.write_text(json.dumps(d,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')

          p=Path('tracking/fase-9.json')
          text=p.read_text(encoding='utf-8')
          replacements={
            '  "etapa_actual": 5,':'  "etapa_actual": 6,',
            '    {"etapa": 6, "nombre": "Enlazado interno", "estado": "NO_INICIADA"},':'    {"etapa": 6, "nombre": "Enlazado interno", "estado": "ETAPA_6_COMPLETADA_ENLAZADO_INTERNO"},',
            '    "etapa_6_iniciada": false\n  },\n  "repositorios_eva_modificados": true,':'    "etapa_6_iniciada": true\n  },\n  "etapa_6": {\n    "estado": "ETAPA_6_COMPLETADA_ENLAZADO_INTERNO",\n    "fuente": "tracking/fase-9-etapa-6.json",\n    "repositorios": 8,\n    "urls_oficiales": 56,\n    "diagnostico_workflow_run_id": 38337973152,\n    "diagnostico_artifact_id": 11785650629,\n    "official_edges_inicial": 414,\n    "orphan_pages_inicial": 2,\n    "unreachable_from_root_inicial": 2,\n    "repositorios_eva_modificados": 1,\n    "archivos_html_modificados": 2,\n    "pull_request_producto": 9,\n    "merge_commit_producto": "5076629ed9d19a80080d6083c66133fba7868e58",\n    "official_edges_final": 416,\n    "missing_route_files_final": 0,\n    "orphan_pages_final": 0,\n    "unreachable_from_root_final": 0,\n    "pages_without_official_outgoing_final": 0,\n    "invalid_hrefs_final": 0,\n    "non_https_internal_links_final": 0,\n    "workflow_run_id": 38338278100,\n    "artifact_id": 11785671168,\n    "validacion_ci": "SUCCESS",\n    "modo_verificacion": "READ_ONLY_INTERNAL_LINK_VERIFY",\n    "etapa_7_iniciada": false\n  },\n  "repositorios_eva_modificados": true,'
          }
          for old,new in replacements.items():
            assert text.count(old)==1, old
            text=text.replace(old,new,1)
          p.write_text(text,encoding='utf-8')

          p=Path('tracking/phases.json')
          lines=p.read_text(encoding='utf-8').splitlines()
          for i,line in enumerate(lines):
            marker='  "fase_9": '
            if not line.startswith(marker): continue
            suffix=',' if line.rstrip().endswith(',') else ''
            phase=json.loads(line[len(marker):].rstrip(','))
            assert phase['etapa_actual']==5
            phase.update({
              'etapa_actual':6,
              'etapa_6_iniciada':True,
              'etapa_6_estado':'ETAPA_6_COMPLETADA_ENLAZADO_INTERNO',
              'etapa_6_diagnostico_workflow_run_id':38337973152,
              'etapa_6_diagnostico_artifact_id':11785650629,
              'urls_oficiales_enlazado':56,
              'official_edges_inicial':414,
              'orphan_pages_inicial':2,
              'unreachable_from_root_inicial':2,
              'repositorios_modificados_etapa_6':1,
              'archivos_html_modificados_etapa_6':2,
              'official_edges_final':416,
              'orphan_pages_final':0,
              'unreachable_from_root_final':0,
              'pages_without_official_outgoing_final':0,
              'invalid_hrefs_final':0,
              'non_https_internal_links_final':0,
              'etapa_6_workflow_run_id':RUN,
              'etapa_6_artifact_id':ART,
              'etapa_6_validacion_ci':'SUCCESS',
              'etapa_7_iniciada':False,
            })
            lines[i]=marker+json.dumps(phase,ensure_ascii=False,separators=(',',':'))+suffix
            break
          else: raise AssertionError('fase_9 no encontrada')
          p.write_text('\n'.join(lines)+'\n',encoding='utf-8')

          p=Path('state/current.json')
          d=json.loads(p.read_text(encoding='utf-8'))
          assert d['phases']['fase_9']['current_stage']==5
          d['phases']['fase_9']['current_stage']=6
          p.write_text(json.dumps(d,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          PY

      - name: Confirmar alcance y publicar
        shell: bash
        run: |
          set -euo pipefail
          expected=$'reports/fase-9-etapa-6-enlazado-interno.json\nstate/current.json\ntracking/fase-9-etapa-6.json\ntracking/fase-9.json\ntracking/phases.json'
          test "$(git diff --name-only | sort)" = "$expected"
          git config user.name "CREBE SEO controlled automation"
          git config user.email "senordelosmilagroscrebe@gmail.com"
          git add reports/fase-9-etapa-6-enlazado-interno.json state/current.json tracking/fase-9-etapa-6.json tracking/fase-9.json tracking/phases.json
          git commit -m "Fase 9 Etapa 6: cerrar enlazado interno"
          git push origin HEAD:fase-9-etapa-6-enlazado-interno
