name: Funcionamiento EVA - Fase 5 Etapa 4

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'functional_prioritization.py'
      - 'tests/test_functional_prioritization.py'
      - '.github/workflows/functional-prioritization.yml'
      - 'docs/FASE_5_ETAPA_4_PRIORIZACION_HALLAZGOS.md'
  push:
    branches: [main]
    paths:
      - 'functional_prioritization.py'
      - 'tests/test_functional_prioritization.py'
      - '.github/workflows/functional-prioritization.yml'

permissions:
  contents: read
  actions: read

concurrency:
  group: crebe-functional-prioritization-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prioritize:
    name: Clasificar y priorizar hallazgos funcionales
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Obtener agente
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Preparar Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Ejecutar pruebas
        run: python -m unittest discover -s tests -v
      - name: Recuperar artefacto validado de Etapa 3
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          ARTIFACT_ID=$(python -c "import json; print(json.load(open('tracking/fase-5.json'))['etapa_3']['resultado']['artifact_id'])")
          gh api -H 'Accept: application/vnd.github+json' "/repos/${{ github.repository }}/actions/artifacts/${ARTIFACT_ID}/zip" > /tmp/fase3.zip
          mkdir -p /tmp/fase3
          unzip -q /tmp/fase3.zip -d /tmp/fase3
          test -f /tmp/fase3/functional-audit/functional-audit.json
      - name: Clasificar y priorizar hallazgos
        run: python functional_prioritization.py --audit /tmp/fase3/functional-audit/functional-audit.json --output reports/functional-prioritization
      - name: Mostrar informe
        if: always()
        shell: bash
        run: |
          if [ -f reports/functional-prioritization/Informe_fase_5_etapa_4.md ]; then
            cat reports/functional-prioritization/Informe_fase_5_etapa_4.md >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Guardar resultados
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: crebe-fase-5-etapa-4-${{ github.run_id }}
          path: reports/functional-prioritization/
          if-no-files-found: warn
          retention-days: 30
