name: Fase 9 Etapa 5 - Diagnostico temporal

on:
  push:
    branches: [fase-9-etapa-5-contenidos]
    paths:
      - '.github/workflows/fase-9-etapa-5-diagnostico-temp.yml'

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Obtener agente
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: fase-9-etapa-5-contenidos
          persist-credentials: false
      - name: Preparar Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
      - name: Obtener repositorios EVA en solo lectura
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p _eva
          cd _eva
          for repo in crebeucayali.github.io accesos-complementarios capacitaciones banco-digital-accesible materiales-educativos-accesibles noti-inclusivos repositorio-accesible DUA-3.0; do
            git clone --depth 1 --filter=blob:none "https://github.com/crebeucayali/${repo}.git" "$repo"
          done
      - name: Diagnosticar contenido de las rutas oficiales
        shell: bash
        run: |
          node --input-type=module - <<'NODE'
          import fs from 'node:fs';
          import path from 'node:path';
          import { EXPECTED, routeFileForUrl } from './seo_indexation_verify.mjs';
          import { analyzeHtml } from './seo_audit.mjs';

          const decode = (s='') => s.replace(/&amp;/g,'&').replace(/&quot;/g,'"').replace(/&#39;/g,"'").replace(/&lt;/g,'<').replace(/&gt;/g,'>').replace(/\s+/g,' ').trim();
          const strip = (html) => decode(html
            .replace(/<script\b[\s\S]*?<\/script>/gi,' ')
            .replace(/<style\b[\s\S]*?<\/style>/gi,' ')
            .replace(/<[^>]+>/g,' '));
          const h1Text = (html) => {
            const m=html.match(/<h1\b[^>]*>([\s\S]*?)<\/h1>/i);
            return m ? decode(m[1].replace(/<[^>]+>/g,' ')) : '';
          };
          const rows=[];
          for (const [repo,spec] of Object.entries(EXPECTED)) {
            for (const url of spec.urls) {
              const file=routeFileForUrl(repo,url);
              const html=fs.readFileSync(path.join('_eva',repo,file),'utf8');
              const a=analyzeHtml(html,file);
              rows.push({repo,url,file,h1_count:a.h1_count,h1:h1Text(html),visible_text_chars:strip(html).length,semantic_terms:Object.entries(a.terms).filter(([,v])=>v).map(([k])=>k)});
            }
          }
          const out={
            fase:9,etapa:5,modo:'READ_ONLY_CONTENT_DIAGNOSIS',
            totals:{
              official_urls:rows.length,
              missing_h1:rows.filter(r=>r.h1_count===0).length,
              multiple_h1:rows.filter(r=>r.h1_count>1).length,
              empty_h1:rows.filter(r=>r.h1_count>0 && !r.h1).length,
              under_120_visible_chars:rows.filter(r=>r.visible_text_chars<120).length,
              without_semantic_terms:rows.filter(r=>r.semantic_terms.length===0).length
            },
            issues:rows.filter(r=>r.h1_count!==1 || !r.h1 || r.visible_text_chars<120 || r.semantic_terms.length===0),
            rows
          };
          fs.mkdirSync('reports',{recursive:true});
          fs.writeFileSync('reports/fase-9-etapa-5-diagnostico.generated.json',JSON.stringify(out,null,2)+'\n','utf8');
          console.log(JSON.stringify(out.totals));
          console.log(JSON.stringify(out.issues,null,2));
          NODE
      - name: Guardar evidencia temporal
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fase-9-etapa-5-diagnostico-${{ github.run_id }}
          path: reports/fase-9-etapa-5-diagnostico.generated.json
          if-no-files-found: error
          retention-days: 7
