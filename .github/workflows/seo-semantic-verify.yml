name: SEO EVA - Fase 9 Etapa 4

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'seo_semantic_verify.mjs'
      - 'tests/seo_semantic_verify.test.mjs'
      - '.github/workflows/seo-semantic-verify.yml'
      - 'reports/fase-9-etapa-4-identidad-semantica.json'
      - 'tracking/fase-9-etapa-4.json'
      - 'tracking/fase-9.json'
      - 'tracking/phases.json'
      - 'state/current.json'

permissions:
  contents: read

concurrency:
  group: crebe-seo-semantic-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verificar identidad semantica sin modificar EVA
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Obtener agente
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Preparar Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'

      - name: Ejecutar pruebas del verificador
        run: node --test tests/seo_semantic_verify.test.mjs

      - name: Obtener repositorios EVA en solo lectura
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p _eva
          cd _eva
          for repo in crebeucayali.github.io accesos-complementarios capacitaciones banco-digital-accesible materiales-educativos-accesibles noti-inclusivos repositorio-accesible DUA-3.0; do
            git clone --depth 1 --filter=blob:none "https://github.com/crebeucayali/${repo}.git" "$repo"
          done

      - name: Verificar identidad semantica y datos estructurados
        run: node seo_semantic_verify.mjs _eva reports/fase-9-etapa-4-identidad-semantica.generated.json

      - name: Validar guardrails y cobertura
        shell: bash
        run: |
          python - <<'PY'
          import json
          p='reports/fase-9-etapa-4-identidad-semantica.generated.json'
          d=json.load(open(p,encoding='utf-8'))
          assert d['fase'] == 9 and d['etapa'] == 4
          assert d['modo'] == 'READ_ONLY_SEMANTIC_VERIFY'
          assert d['totals']['repositories'] == 8
          assert d['totals']['entry_pages'] == 8
          assert d['totals']['root_preexisting_structured_data'] == 1
          assert d['totals']['module_pages_enriched'] == 7
          assert d['totals']['pages_with_structured_data'] == 8
          for key in ('invalid_jsonld','identity_mismatch','page_metadata_mismatch','csp_hash_mismatch','failing_pages'):
              assert d['totals'][key] == 0, (key, d['totals'][key])
          assert d['guardrails']['read_only'] is True
          assert d['guardrails']['repositorios_eva_modificados_por_verificador'] is False
          assert d['guardrails']['supabase_modificado'] is False
          assert d['guardrails']['panel_administrativo_modificado'] is False
          assert d['guardrails']['accesibilidad_modificada'] is False
          assert d['guardrails']['etapa_5_iniciada'] is False
          print('Validación Fase 9 Etapa 4: OK')
          PY

      - name: Mostrar resumen
        if: always()
        shell: bash
        run: |
          if [ -f reports/fase-9-etapa-4-identidad-semantica.generated.json ]; then
            echo '## SEO EVA - Fase 9 Etapa 4' >> "$GITHUB_STEP_SUMMARY"
            python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          d=json.load(open('reports/fase-9-etapa-4-identidad-semantica.generated.json',encoding='utf-8'))
          print('```json')
          print(json.dumps({'totals': d['totals'], 'guardrails': d['guardrails']}, ensure_ascii=False, indent=2))
          print('```')
          PY
          fi

      - name: Guardar evidencia
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fase-9-etapa-4-identidad-semantica-${{ github.run_id }}
          path: reports/fase-9-etapa-4-identidad-semantica.generated.json
          if-no-files-found: warn
          retention-days: 30
