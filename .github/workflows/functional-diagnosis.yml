name: Funcionamiento EVA - Fase 5 Etapa 5

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'functional_diagnosis.py'
      - 'config/functional-diagnosis-evidence.json'
      - 'tests/test_functional_diagnosis.py'
      - '.github/workflows/functional-diagnosis.yml'
      - 'docs/FASE_5_ETAPA_5_DIAGNOSTICO_TECNICO.md'
      - 'tracking/fase-5-etapa-5.json'
      - 'tracking/fase-5.json'
      - 'tracking/phases.json'
  push:
    branches: [main]
    paths:
      - 'functional_diagnosis.py'
      - 'config/functional-diagnosis-evidence.json'
      - 'tests/test_functional_diagnosis.py'
      - '.github/workflows/functional-diagnosis.yml'

permissions:
  contents: read
  actions: read

concurrency:
  group: crebe-functional-diagnosis-${{ github.ref }}
  cancel-in-progress: false

jobs:
  diagnose:
    name: Diagnosticar hallazgos funcionales
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Obtener agente
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Preparar Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Ejecutar pruebas
        run: python -m unittest discover -s tests -v
      - name: Recuperar artefacto validado de Etapa 4
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          ARTIFACT_ID=$(python -c "import json; print(json.load(open('tracking/fase-5-etapa-4.json'))['resultado']['artifact_id'])")
          gh api -H 'Accept: application/vnd.github+json' "/repos/${{ github.repository }}/actions/artifacts/${ARTIFACT_ID}/zip" > /tmp/fase4.zip
          mkdir -p /tmp/fase4
          unzip -q /tmp/fase4.zip -d /tmp/fase4
          test -f /tmp/fase4/functional-prioritization/functional-prioritization.json
      - name: Generar diagnostico tecnico
        run: python functional_diagnosis.py --prioritization /tmp/fase4/functional-prioritization/functional-prioritization.json --evidence config/functional-diagnosis-evidence.json --output reports/functional-diagnosis
      - name: Mostrar informe
        if: always()
        shell: bash
        run: |
          if [ -f reports/functional-diagnosis/Informe_fase_5_etapa_5.md ]; then
            cat reports/functional-diagnosis/Informe_fase_5_etapa_5.md >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Guardar resultados
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: crebe-fase-5-etapa-5-${{ github.run_id }}
          path: reports/functional-diagnosis/
          if-no-files-found: warn
          retention-days: 30
