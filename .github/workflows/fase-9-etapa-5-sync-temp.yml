name: Fase 9 Etapa 5 - Sincronizacion temporal

on:
  push:
    branches: [fase-9-etapa-5-contenidos]
    paths:
      - '.github/workflows/fase-9-etapa-5-sync-temp.yml'

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Obtener rama controlada
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: fase-9-etapa-5-contenidos

      - name: Sincronizar tracking global y estado canónico
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import json

          phases_path = Path('tracking/phases.json')
          lines = phases_path.read_text(encoding='utf-8').splitlines()
          found = False
          for i, line in enumerate(lines):
              marker = '  "fase_9": '
              if not line.startswith(marker):
                  continue
              found = True
              suffix = ',' if line.rstrip().endswith(',') else ''
              phase = json.loads(line[len(marker):].rstrip(','))
              phase.update({
                  'etapa_actual': 5,
                  'etapa_5_iniciada': True,
                  'etapa_5_estado': 'ETAPA_5_COMPLETADA_SEO_CONTENIDOS',
                  'etapa_5_diagnostico_workflow_run_id': 38328210682,
                  'etapa_5_diagnostico_artifact_id': 11782291068,
                  'urls_oficiales_contenido': 56,
                  'multiple_h1_contenido_inicial': 2,
                  'paginas_con_fallo_contenido_inicial': 2,
                  'repositorios_modificados_etapa_5': 1,
                  'archivos_html_modificados_etapa_5': 2,
                  'archivos_css_modificados_etapa_5': 2,
                  'paginas_corregidas_etapa_5': 2,
                  'missing_h1_contenido_final': 0,
                  'multiple_h1_contenido_final': 0,
                  'empty_h1_contenido_final': 0,
                  'under_120_visible_chars_final': 0,
                  'without_semantic_terms_final': 0,
                  'paginas_con_fallo_contenido_final': 0,
                  'etapa_5_workflow_run_id': None,
                  'etapa_5_artifact_id': None,
                  'etapa_5_validacion_ci': 'PENDIENTE_PR',
                  'etapa_6_iniciada': False
              })
              lines[i] = marker + json.dumps(phase, ensure_ascii=False, separators=(',', ':')) + suffix
              break
          assert found
          phases_path.write_text('\n'.join(lines) + '\n', encoding='utf-8')

          state_path = Path('state/current.json')
          state = json.loads(state_path.read_text(encoding='utf-8'))
          assert state['phases']['fase_9']['status'] == 'EN_CURSO'
          state['phases']['fase_9']['current_stage'] = 5
          state_path.write_text(json.dumps(state, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PY

      - name: Confirmar alcance y publicar
        shell: bash
        run: |
          set -euo pipefail
          test "$(git diff --name-only | sort | tr '\n' ' ')" = "state/current.json tracking/phases.json "
          git config user.name "CREBE SEO controlled automation"
          git config user.email "senordelosmilagroscrebe@gmail.com"
          git add tracking/phases.json state/current.json
          git commit -m "Fase 9 Etapa 5: sincronizar estado canónico"
          git push origin HEAD:fase-9-etapa-5-contenidos
