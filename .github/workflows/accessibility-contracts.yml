name: Accesibilidad EVA - Fase 8 Etapa 2

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'reports/fase-8-etapa-2-contratos-accesibilidad.json'
      - 'tracking/fase-8-etapa-2.json'
      - 'tracking/fase-8.json'
      - 'tracking/phases.json'
      - 'docs/FASE_8_ETAPA_2_CONTRATOS_ACCESIBILIDAD.md'
      - 'accessibility_contracts_validate.py'
      - 'tests/test_accessibility_contracts.py'
      - '.github/workflows/accessibility-contracts.yml'

permissions:
  contents: read

jobs:
  validate:
    name: Validar contratos de accesibilidad
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Obtener agente
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Preparar Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Ejecutar pruebas
        run: python -m unittest tests.test_accessibility_contracts -v

      - name: Validar contratos
        run: python accessibility_contracts_validate.py
