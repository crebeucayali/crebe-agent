name: Fase 9 Etapa 4 - Sincronizacion temporal

on:
  push:
    branches: [fase-9-etapa-4-semantic-data]
    paths:
      - '.github/workflows/fase-9-etapa-4-sync-temp.yml'

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Obtener rama controlada
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: fase-9-etapa-4-semantic-data

      - name: Sincronizar tracking global y estado canónico
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import json

          phases_path = Path('tracking/phases.json')
          lines = phases_path.read_text(encoding='utf-8').splitlines()
          found = False
          for i, line in enumerate(lines):
              marker = '  "fase_9": '
              if not line.startswith(marker):
                  continue
              found = True
              suffix = ',' if line.rstrip().endswith(',') else ''
              raw = line[len(marker):].rstrip(',')
              phase = json.loads(raw)
              phase.update({
                  'etapa_actual': 4,
                  'etapa_4_iniciada': True,
                  'etapa_4_estado': 'ETAPA_4_COMPLETADA_IDENTIDAD_SEMANTICA',
                  'etapa_4_workflow_run_id': None,
                  'etapa_4_artifact_id': None,
                  'paginas_entrada_semantica': 8,
                  'datos_estructurados_preexistentes_portal': 1,
                  'portadas_modulo_enriquecidas': 7,
                  'paginas_con_datos_estructurados': 8,
                  'repositorios_modificados_etapa_4': 7,
                  'archivos_html_modificados_etapa_4': 7,
                  'invalid_jsonld_final': 0,
                  'identity_mismatch_final': 0,
                  'page_metadata_mismatch_final': 0,
                  'csp_hash_mismatch_final': 0,
                  'paginas_con_fallo_semantico_final': 0,
                  'etapa_5_iniciada': False,
                  'repositorios_eva_modificados': True,
                  'repositorios_eva_modificados_lista': [
                      'crebeucayali/crebeucayali.github.io',
                      'crebeucayali/accesos-complementarios',
                      'crebeucayali/capacitaciones',
                      'crebeucayali/banco-digital-accesible',
                      'crebeucayali/materiales-educativos-accesibles',
                      'crebeucayali/noti-inclusivos',
                      'crebeucayali/repositorio-accesible',
                      'crebeucayali/DUA-3.0'
                  ]
              })
              lines[i] = marker + json.dumps(phase, ensure_ascii=False, separators=(',', ':')) + suffix
              break
          assert found
          phases_path.write_text('\n'.join(lines) + '\n', encoding='utf-8')

          state_path = Path('state/current.json')
          state = json.loads(state_path.read_text(encoding='utf-8'))
          assert state['phases']['fase_9']['status'] == 'EN_CURSO'
          state['phases']['fase_9']['current_stage'] = 4
          state_path.write_text(json.dumps(state, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PY

      - name: Confirmar alcance y publicar
        shell: bash
        run: |
          set -euo pipefail
          test "$(git diff --name-only | sort | tr '\n' ' ')" = "state/current.json tracking/phases.json "
          git config user.name "CREBE SEO controlled automation"
          git config user.email "senordelosmilagroscrebe@gmail.com"
          git add tracking/phases.json state/current.json
          git commit -m "Fase 9 Etapa 4: sincronizar estado canónico"
          git push origin HEAD:fase-9-etapa-4-semantic-data
