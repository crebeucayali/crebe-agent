name: Fase 9 Etapa 5 - Evidencia temporal

on:
  push:
    branches: [fase-9-etapa-5-contenidos]
    paths:
      - '.github/workflows/fase-9-etapa-5-evidence-temp.yml'

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Obtener rama controlada
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: fase-9-etapa-5-contenidos
      - name: Registrar evidencia en tracking global
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import json
          p=Path('tracking/phases.json')
          lines=p.read_text(encoding='utf-8').splitlines()
          for i,line in enumerate(lines):
              marker='  "fase_9": '
              if not line.startswith(marker):
                  continue
              suffix=',' if line.rstrip().endswith(',') else ''
              phase=json.loads(line[len(marker):].rstrip(','))
              assert phase['etapa_actual'] == 5
              phase['etapa_5_workflow_run_id']=38328868447
              phase['etapa_5_artifact_id']=11781677233
              phase['etapa_5_validacion_ci']='SUCCESS'
              phase['etapa_6_iniciada']=False
              lines[i]=marker+json.dumps(phase,ensure_ascii=False,separators=(',',':'))+suffix
              break
          else:
              raise AssertionError('fase_9 no encontrada')
          p.write_text('\n'.join(lines)+'\n',encoding='utf-8')
          PY
      - name: Confirmar alcance y publicar
        shell: bash
        run: |
          set -euo pipefail
          test "$(git diff --name-only | tr -d '\r')" = "tracking/phases.json"
          git config user.name "CREBE SEO controlled automation"
          git config user.email "senordelosmilagroscrebe@gmail.com"
          git add tracking/phases.json
          git commit -m "Fase 9 Etapa 5: registrar evidencia CI global"
          git push origin HEAD:fase-9-etapa-5-contenidos
