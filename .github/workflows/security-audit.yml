name: Seguridad EVA - Fase 7 Etapa 3

on:
  pull_request:
    paths:
      - 'reports/fase-7-etapa-3-linea-base-seguridad.json'
      - 'docs/FASE_7_ETAPA_3_AUDITORIA_SEGURIDAD.md'
      - 'security_audit_validate.py'
      - 'tests/test_security_audit.py'
      - 'tracking/fase-7-etapa-3.json'
      - 'tracking/fase-7.json'
      - 'tracking/phases.json'
      - '.github/workflows/security-audit.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-security-audit:
    runs-on: ubuntu-latest
    steps:
      - name: Obtener agente
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Preparar Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Ejecutar pruebas
        run: python -m unittest -q tests/test_security_audit.py
      - name: Validar linea base
        run: python security_audit_validate.py
