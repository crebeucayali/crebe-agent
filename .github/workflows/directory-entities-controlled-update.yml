name: Directorio de entidades - Actualización controlada

on:
  workflow_dispatch:
  schedule:
    - cron: '0 13 1,15 * *'
  pull_request:
    branches: [main]
    paths:
      - 'directory_entities_verify.mjs'
      - 'tests/directory_entities_verify.test.mjs'
      - 'directory_entities_proposals.mjs'
      - 'directory_entities_apply_approved.mjs'
      - 'directory_entities_maintenance_summary.mjs'
      - 'tests/directory_entities_stage5.test.mjs'
      - 'tests/directory_entities_stage6.test.mjs'
      - 'config/directorio-entidades-candidatos.json'
      - 'config/directorio-entidades-aprobaciones.json'
      - 'tracking/directorio-entidades-referencia.json'
      - '.github/workflows/directory-entities-controlled-update.yml'
      - 'docs/DIRECTORIO_ENTIDADES_ETAPA_5_ACTUALIZACION_CONTROLADA.md'
      - 'docs/DIRECTORIO_ENTIDADES_ETAPA_6_MANTENIMIENTO_PERIODICO.md'
      - 'tracking/directorio-entidades-etapa-5.json'
      - 'tracking/directorio-entidades-etapa-6.json'

permissions:
  contents: read

concurrency:
  group: crebe-directory-entities-controlled-${{ github.ref }}
  cancel-in-progress: true

jobs:
  controlled-update:
    name: Verificar y mantener directorio sin modificar datos
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Obtener agente
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Obtener Accesos Complementarios en modo lectura
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: crebeucayali/accesos-complementarios
          ref: main
          path: target
          persist-credentials: false

      - name: Preparar Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'

      - name: Ejecutar pruebas de verificación y control
        run: |
          node --test tests/directory_entities_verify.test.mjs
          node --test tests/directory_entities_stage5.test.mjs
          node --test tests/directory_entities_stage6.test.mjs

      - name: Verificar directorio actual
        run: node directory_entities_verify.mjs --source target/directorios/directorio-ciudadano.js --output reports/directorio-entidades --concurrency 6

      - name: Comparar con referencia aprobada
        run: node directory_entities_maintenance_summary.mjs --verification reports/directorio-entidades/verificacion.json --reference tracking/directorio-entidades-referencia.json --output reports/directorio-entidades

      - name: Generar propuestas controladas
        run: node directory_entities_proposals.mjs --verification reports/directorio-entidades/verificacion.json --candidates config/directorio-entidades-candidatos.json --output reports/directorio-entidades

      - name: Aplicar únicamente aprobaciones a una copia temporal
        run: node directory_entities_apply_approved.mjs --source target/directorios/directorio-ciudadano.js --proposals reports/directorio-entidades/propuestas.json --approvals config/directorio-entidades-aprobaciones.json --output reports/directorio-entidades/directorio-ciudadano.propuesto.js

      - name: Generar diff de revisión
        shell: bash
        run: diff -u target/directorios/directorio-ciudadano.js reports/directorio-entidades/directorio-ciudadano.propuesto.js > reports/directorio-entidades/cambios-aprobados.patch || true

      - name: Mostrar mantenimiento
        if: always()
        shell: bash
        run: |
          if [ -f reports/directorio-entidades/Mantenimiento_periodico_directorio.md ]; then
            cat reports/directorio-entidades/Mantenimiento_periodico_directorio.md >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ -f reports/directorio-entidades/mantenimiento-periodico.json ] && node -e "const x=require('./reports/directorio-entidades/mantenimiento-periodico.json'); process.exit(x.requiere_atencion?0:1)"; then
            printf '\n---\n\n' >> "$GITHUB_STEP_SUMMARY"
            cat reports/directorio-entidades/Propuestas_directorio_entidades.md >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Guardar evidencia
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: directorio-entidades-mantenimiento-${{ github.run_id }}
          path: reports/directorio-entidades/
          if-no-files-found: error
          retention-days: 30
